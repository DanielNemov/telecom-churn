[tool.poetry]
name = "telecom-churn"
version = "1.0.0"
description = "Production ML pipeline for telecom customer churn prediction"
authors = ["Daniil Nemov"]
readme = "README.md"
packages = [{ include = "telecom_churn", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
scikit-learn = ">=1.3.0"
mlflow = ">=2.10.0"
evidently = ">=0.4.0"
psutil = ">=5.9.0"
matplotlib = ">=3.7.0"
seaborn = ">=0.12.0"
lightgbm = ">=4.0.0"
xgboost = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
ipykernel = ">=6.25.0"
notebook = ">=7.0.0"
pre-commit = ">=3.6.0"
ruff = ">=0.4.0"
black = ">=24.3.0"
isort = ">=5.13.0"
flake8 = ">=7.0.0"

[tool.poetry.scripts]
churn-etl = "telecom_churn.etl.pipeline:run_etl"
churn-train = "telecom_churn.model.train:train"
churn-predict = "telecom_churn.model.predict:main"
churn-monitor = "telecom_churn.monitoring.monitor:run_monitoring"
churn-plots = "telecom_churn.visualization.plots:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
