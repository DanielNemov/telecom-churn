version: "3.9"

services:
  etl:
    build: .
    command: python src/etl/pipeline.py
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  train:
    build: .
    command: python src/model/train.py
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=/app/mlruns
    depends_on:
      - etl

  monitor:
    build: .
    command: python src/monitoring/monitor.py
    volumes:
      - ./data:/app/data
      - ./mlruns:/app/mlruns
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=/app/mlruns
    depends_on:
      - train

  mlflow:
    image: python:3.11-slim
    command: >
      sh -c "pip install mlflow --quiet &&
             mlflow server
             --backend-store-uri /app/mlruns
             --default-artifact-root /app/mlruns
             --host 0.0.0.0
             --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
